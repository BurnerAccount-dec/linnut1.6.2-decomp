<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Angry Birds</title>
<style>
body{margin:0;background:#3a5510;color:#fff;font-family:Arial,Helvetica,sans-serif}
#wrap{width:964px;margin:0 auto;position:relative;min-height:760px}
#nav{text-align:center;padding-top:62px;font-weight:bold;font-size:15px;height:48px;padding-right:20px}
#nav a{color:#fff;text-decoration:none;cursor:pointer;margin:0 5px} #nav a:hover{text-decoration:underline}
#user{position:absolute;left:676px;top:30px;width:230px;font-size:12px}
#av{width:32px;height:32px;border:1px solid #cfd8b0;background:#1c2c08;float:left;margin-right:10px}
#uname{color:#3f78b8;font-size:13px;display:block;margin-top:1px} #coins{font-size:11px;color:#fff}
#links{clear:both;margin:4px 0 0 42px;height:46px} #links a{color:#4c86c4;cursor:pointer;display:block;font-size:13px;line-height:21px}
#nums{margin:6px 0 0 0;width:231px;height:64px;background:url(img/bar.png) no-repeat;background-size:231px 64px;background-color:#1993c8;border-radius:10px;font-weight:bold;font-size:20px;color:#ffd84a;display:flex;align-items:center;padding-left:14px;box-sizing:border-box} #nums span{margin:0 16px 0 6px;text-shadow:0 1px 0 #6b4a00} #nums span+img+span{color:#e8f2f6;text-shadow:0 1px 0 #3d5560} #nums img{height:30px}
#loginbox{display:none;position:absolute;left:676px;top:112px;width:225px;background:#fff;color:#222;border-radius:8px;padding:10px;z-index:5;font-size:12px}
#loginbox input{width:100%;box-sizing:border-box;margin:3px 0;padding:4px} #loginbox button{margin-top:4px;padding:4px 12px}
#g{position:absolute;left:0;top:112px;width:685px;height:640px}
#tabs{position:absolute;left:694px;top:196px;width:270px;font-size:11px;color:#6f8a42} #tabs a{margin-right:14px;cursor:pointer} #tabs a.on{color:#c9d7a8}
#panel{position:absolute;left:694px;top:214px;width:270px;height:360px;background:#fff;border-radius:14px;color:#222;overflow:auto;padding:14px 16px 10px;box-sizing:border-box}
#panel .it{margin-bottom:12px} #panel b{display:block;font-size:15px;color:#333} #panel span{font-size:10.5px;color:#666;display:block;line-height:1.25}
#pg{position:absolute;left:694px;top:582px;width:270px;text-align:center;height:37px} #pg img{height:37px;margin:0;cursor:pointer;vertical-align:top}
#panel .empty{text-align:center;padding-top:60px} #panel .empty img{width:76px;display:block;margin:0 auto 10px}
#msg{position:absolute;left:0;top:758px;font-size:12px;color:#b6c98f}
</style>
<script>
// In the original site this page was the host: it logged the player in and told the game what to show
// (the game's ExternalInterface methods: setAuthToken, setUserName, showEditor, showLevel, showSavedLevel).
function swf() { return document.getElementById("g"); }
function $(id) { return document.getElementById(id); }
function say(t) { $("msg").textContent = t; }
function call(name, arg) {
    try { var s = swf(); return arg === undefined ? s[name]() : s[name](arg); }
    catch (e) { say("The game is not ready yet (" + name + "): " + e); }
}
function parseReply(text) {
    var o = {}; text.split("&").forEach(function (p) { var i = p.indexOf("="); if (i > 0) o[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); });
    if (o.json) { try { var j = JSON.parse(o.json); for (var k in j) o[k] = j[k]; } catch (e) {} }
    return o;
}
function get(url, done) { var x = new XMLHttpRequest(); x.open("GET", url); x.onload = function () { done(x.responseText); }; x.onerror = function () { done(null); }; x.send(); }

// ---- the box at the top right: who is signed in, and what they have made
var token = null;
function post(url, body, done) { var x = new XMLHttpRequest(); x.open("POST", url); x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded"); x.onload = function () { done(parseReply(x.responseText)); }; x.send(body); }
function showUser(name) {
    $("uname").textContent = name || "Guest";
    $("av").src = name ? "/services/downloadProfileImage?user=" + encodeURIComponent(name) + "&t=" + Date.now() : "";
    $("links").innerHTML = name ? "<a onclick='signOut()'>Sign out</a>" : "<a onclick='openLogin()'>Log in</a><a onclick='openLogin()'>Sign up</a>";
    $("nums").style.visibility = name ? "visible" : "hidden";
    if (!name) { $("coins").textContent = ""; return; }
    get("/classic/levels.txt", function (t) {         // levels published
        var n = 0; (t || "").split("\n").forEach(function (l) { if (l.split("\t")[2] === name) n++; });
        $("coins").textContent = n + (n === 1 ? " level" : " levels");
    });
    if (token) post("/services/getMetaGameData", "token=" + encodeURIComponent(token), function (r) { $("n1").textContent = r.coin || 0; $("n2").textContent = r.goldenEgg || 0; });
}
function openLogin() { $("loginbox").style.display = "block"; $("em").focus(); }
function signOut() { var x = new XMLHttpRequest(); x.open("POST", "/signout"); x.onload = function () { location.reload(); }; x.send(); }
function login() {
    var x = new XMLHttpRequest();
    x.open("POST", "/services/login");
    x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    x.onload = function () {
        var r = parseReply(x.responseText);
        if (!r.token) { say("Login failed: " + (r.E || x.responseText)); return; }
        call("setUserName", r.username); call("setAuthToken", r.token);
        $("loginbox").style.display = "none"; token = r.token; showUser(r.username); say("Logged in as " + r.username);
    };
    x.onerror = function () { say("Could not reach the server"); };
    x.send("auth=" + encodeURIComponent($("em").value) + "&pass=" + encodeURIComponent($("pw").value) + "&type=AB");
}

// ---- the box at the right: News (what just happened on the server), Quests and Inbox
var tab = "news", page = 0, PER = 5;
function pick(t, pg) {
    tab = t; page = pg || 0; ["news", "quests", "inbox"].forEach(function (n) { $("t_" + n).className = n === t ? "on" : ""; });
    var p = $("panel"); p.innerHTML = ""; $("pg").innerHTML = "";
    function item(title, text) { var d = document.createElement("div"); d.className = "it"; d.innerHTML = "<b></b><span></span>"; d.firstChild.textContent = title; d.lastChild.textContent = text; p.appendChild(d); }
    function empty(title, text) { var d = document.createElement("div"); d.className = "empty"; d.innerHTML = "<img src='img/pig.png' alt='' onerror=\"this.style.display='none'\"><b></b><span></span>"; d.children[1].textContent = title; d.children[2].textContent = text; p.appendChild(d); }
    if (t === "news") get("/classic/news.json", function (txt) {
        var list = []; try { list = JSON.parse(txt); } catch (e) {}
        if (tab !== "news") return;
        if (!list.length) { empty("Nothing yet", "Play or publish a level and it shows up here."); return; }
        list.slice(page * PER, page * PER + PER).forEach(function (a) { item(/scored|best/.test(a.text) ? "Rivalry!" : "News", a.user + " " + a.text); });
        var more = list.length > (page + 1) * PER, back = page > 0;
        function arrow(on, src, off, go) { var i = document.createElement("img"); i.src = on ? src : off; i.onerror = function () { i.style.display = "none"; }; if (on) i.onclick = go; $("pg").appendChild(i); }
        if (list.length > PER) { arrow(back, "img/prev.png", "img/prev_off.png", function () { pick("news", page - 1); }); arrow(more, "img/next.png", "img/next_off.png", function () { pick("news", page + 1); }); }
    });
    else if (t === "quests") empty("Publish a level", "Build a level and press Publish.");
    else empty("No messages", "Nothing in your inbox.");
}

// the game calls these on the page; nothing here needs a real site behind it
var noop = function () { return null; };
["getFacebookFriendsForSwf","getSessionInfo","getUserFacebookInfo","updateLevelPage","setCurrentLevel","setCoins",
 "setGoldenEggs","setXp","setLevel","showSavedLevel","getLevelInfo","updateFriendsProfile"].forEach(function (n) { window[n] = noop; });
window.showLogin = function () { openLogin(); };
window.showRegister = window.showLogin;

function resume() {      // the server remembers who signed in last from this computer
    showUser(null); pick("news");
    get("/session", function (txt) {
        var r = {}; try { r = JSON.parse(txt); } catch (e) {}
        if (!r.token) return;
        $("em").value = r.email || "";
        token = r.token; showUser(r.username);
        var tries = 0, t = setInterval(function () {
            var s = swf();
            if (s && typeof s.setAuthToken === "function") { clearInterval(t); call("setUserName", r.username); call("setAuthToken", r.token); say("Signed in as " + r.username); }
            else if (++tries > 80) clearInterval(t);
        }, 500);
    });
}
window.addEventListener("load", resume);
</script></head>
<body>
<div id="wrap">
  <div id="nav"><a onclick="location.reload()">Home</a> | <a onclick="call('showLevel', {})">Browse</a> | <a onclick="call('showEditor', {})">Build</a> | <a href="/classic/players">Profile</a></div>
  <div id="user">
    <img id="av" alt=""><span id="uname">Guest</span><span id="coins"></span>
    <div id="links"></div>
    <div id="nums"><img src="img/coin.png" alt="" onerror="this.style.display='none'"><span id="n1">0</span><img src="img/diamond.png" alt="" onerror="this.style.display='none'"><span id="n2">0</span></div>
  </div>
  <div id="loginbox">
    <input id="em" placeholder="e-mail" value="player@example.com"><input id="pw" type="password" placeholder="password" value="pw">
    <button onclick="login()">Log in</button> <span style="color:#777">the first log in makes the account</span>
  </div>
  <embed id="g" src="AngryBirdsSocial62.swf" type="application/x-shockwave-flash" width="685" height="640"
         allowscriptaccess="always" allowfullscreen="true" wmode="direct" quality="high" bgcolor="#3a5510">
  <div id="tabs"><a id="t_news" onclick="pick('news')">News</a><a id="t_quests" onclick="pick('quests')">Quests</a><a id="t_inbox" onclick="pick('inbox')">Inbox</a></div>
  <div id="panel"></div>
  <div id="pg"></div>
  <div id="msg">Pick Browse to play levels or Build for the level editor.</div>
</div>
</body></html>
